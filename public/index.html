<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dce7fa">
  <meta name="description" content="LeetCode Two-Sum 中美两区在线人数趋势，按小时、天、月查看采样峰值。">
  <title>LeetCode Two-Sum · 在线人数监控</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27%23356bd8%27/%3E%3Cpath d=%27M7 24V8m0 16h18M10 19l5-7 4 4 6-9%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js" defer></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
<div id="two-sum-liquid-glass" aria-label="LeetCode Two-Sum 在线人数监控" style="--lg-blur:21px">
  <div class="lg-app">
    <div class="lg-wallpaper" aria-hidden="true"><div class="lg-orb lg-orb-blue"></div><div class="lg-orb lg-orb-pink"></div><div class="lg-orb lg-orb-mint"></div><div class="lg-ribbon"></div></div>
    <div class="lg-page">
      <header class="lg-header"><div class="lg-title-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18M7 14l4-5 4 3 6-8"/></svg></div><h1>LeetCode Two-Sum</h1><p>在线刷题人数监控</p></header>
      <div class="lg-stats">
        <article class="lg-stat lg-glass"><div class="lg-stat-heading"><span class="lg-icon lg-us-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></span><span>国际区 <small>US</small></span></div><div class="lg-stat-value"><strong data-us-count>—</strong><span>人</span></div><span class="lg-stat-time" data-us-time>等待数据</span></article>
        <article class="lg-stat lg-glass"><div class="lg-stat-heading"><span class="lg-icon lg-cn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span>中国区 <small>CN</small></span></div><div class="lg-stat-value"><strong data-cn-count>—</strong><span>人</span></div><span class="lg-stat-time" data-cn-time>等待数据</span></article>
        <article class="lg-stat lg-glass"><div class="lg-stat-heading"><span class="lg-icon lg-total-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18M7 14l4-5 4 3 6-8"/></svg></span><span>数据点数</span></div><div class="lg-stat-value"><strong data-point-count>—</strong><span>条</span></div><span class="lg-stat-time" data-updated>等待数据</span></article>
      </div>
      <div class="lg-toolbar" aria-label="图表显示设置">
        <div class="lg-segment lg-glass" role="group" aria-label="时间粒度"><span class="lg-lens" aria-hidden="true"></span><button type="button" class="cursor-interaction" data-grain="hour" aria-pressed="true">小时</button><button type="button" class="cursor-interaction" data-grain="day" aria-pressed="false">天</button><button type="button" class="cursor-interaction" data-grain="month" aria-pressed="false">月</button></div>
        <div class="lg-tools"><label class="lg-timezone lg-glass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5h4"/></svg><select class="cursor-interaction" aria-label="显示时区"><option value="-480">洛杉矶 UTC−8</option><option value="-300">纽约 UTC−5</option><option value="0">英国 UTC</option><option value="60">法国 UTC+1</option><option value="180">莫斯科 UTC+3</option><option value="480" selected>中国 UTC+8</option><option value="540">日本 / 韩国 UTC+9</option><option value="720">新西兰 UTC+12</option></select></label><button type="button" class="lg-refresh lg-glass cursor-interaction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg><span>刷新</span></button></div>
      </div>
      <div class="lg-error" role="status" hidden></div>
      <main class="lg-chart-panel">
        <div class="lg-chart-heading"><div><h2>在线人数趋势</h2><p data-range-title>过去 7 天 · 小时峰值</p></div><div class="lg-legend" aria-label="图例"><span><i class="lg-legend-us"></i>国际区 US</span><span><i class="lg-legend-cn"></i>中国区 CN</span><span class="lg-weekend-key"><i class="lg-legend-weekend"></i>周末底色</span></div></div>
        <div class="lg-plot" role="img" aria-label="US 和 CN 在线人数峰值对比图"><div id="chart" class="lg-chart"></div><p class="lg-empty" hidden>该时间范围暂无数据</p></div>
        <div class="lg-chart-bottom"><span class="lg-hover-note">同一时间轴 · 左轴 US / 右轴 CN</span><span data-chart-detail>每个点为区间最高采样人数</span></div>
      </main>
      <footer class="lg-footer"><span><i class="lg-live-dot" aria-hidden="true"></i>每 2 分钟采集</span><span data-status aria-live="polite">Cloudflare Workers · D1 · Pages</span></footer>
    </div>
  </div>
</div>
<noscript>请启用 JavaScript 查看实时数据。</noscript>
</body>
</html>
